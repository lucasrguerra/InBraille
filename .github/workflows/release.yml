name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/lucasrguerra/inbraille

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libxrender1 libosmesa6
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  publish:
    runs-on: ubuntu-latest
    needs: test
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest
      - name: Build (amd64) for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: inbraille:scan
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
      - name: Block release on vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inbraille:scan
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "1"
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker image

            ```
            docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```
      - name: Deploy to Coolify
        if: ${{ env.COOLIFY_TOKEN != '' }}
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          api="$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID"
          auth="Authorization: Bearer $COOLIFY_TOKEN"
          body="{\"key\":\"INBRAILLE_VERSION\",\"value\":\"$VERSION\",\"is_preview\":false}"
          curl -fsS -X PATCH "$api/envs" -H "$auth" -H "Content-Type: application/json" -d "$body" \
            || curl -fsS -X POST "$api/envs" -H "$auth" -H "Content-Type: application/json" -d "$body"
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" -H "$auth"
