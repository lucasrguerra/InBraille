name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches new CVEs in unchanged dependencies

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libxrender1 libosmesa6
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan dependencies, secrets and Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "1"

  image:
    runs-on: ubuntu-latest
    needs: [test, trivy]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t inbraille:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inbraille:ci
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 inbraille:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/ >/dev/null && exit 0; sleep 2; done
          docker logs app; exit 1
