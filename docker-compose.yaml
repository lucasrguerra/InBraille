services:
  app:
    # Pull a published release by default; use `docker compose up --build` to build locally.
    image: ghcr.io/lucasrguerra/inbraille:${INBRAILLE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inbraille
    ports:
      - "3000"
    environment:
      PORT: "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    pids_limit: 256
    restart: unless-stopped
