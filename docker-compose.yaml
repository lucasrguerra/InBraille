# Production: runs a published release image (used by Coolify). Pin the version with INBRAILLE_VERSION.
# For local development use: docker compose -f docker-compose.dev.yaml up --build
services:
  app:
    image: ghcr.io/lucasrguerra/inbraille:${INBRAILLE_VERSION:-latest}
    container_name: inbraille
    ports:
      - "3000"
    environment:
      PORT: "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    pids_limit: 256
    restart: unless-stopped
